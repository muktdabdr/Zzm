
name: Build Zahrati APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Zahrati-Android-Project-FIXED.zip'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Zahrati Android project ZIP
        run: |
          unzip -q Zahrati-Android-Project-FIXED.zip -d source
          test -f source/settings.gradle
          test -f source/app/src/main/assets/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Zahrati APK
        run: gradle --no-daemon -p source assembleDebug

      - name: Upload Zahrati APK
        uses: actions/upload-artifact@v4
        with:
          name: Zahrati-debug-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
